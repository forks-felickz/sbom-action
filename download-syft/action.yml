name: "Anchore SBOM Action / Download Syft"
description: "Downloads Syft to the Action tool cache and provides a reference"
author: "Anchore"

inputs:
  run:
    required: true
    description: "The action to run"
    default: "download-syft"
    type: "choice"
    options: ["download-syft"]

  syft-version:
    required: false
    description: "The version of Syft to download"

  syft-path:
    required: false
    description: >
      Path to a pre-installed Syft binary. When specified, the action will skip
      downloading Syft from GitHub. Useful for air-gapped environments.

outputs:
  cmd:
    description: "A reference to the Syft command"

runs:
  using: "node24"
  main: "../dist/index.cjs"
